name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        if: ${{ !env.ACT }}
        id: create-app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ env.ACT }}
        with:
          token: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ !env.ACT }}
        with:
          token: ${{ steps.create-app-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - name: install dependencies
        run: npm install
      - name: update data
        id: db-update
        run: |
          npm run db:update
          echo "processed_issues=$(cat temp/logs/update.log)" >> $GITHUB_OUTPUT
      - name: validate changes
        run: npm run db:validate
      - name: check if files are crlf
        uses: kforeverisback/check-crlf-extended@bb2dea99a7da756525ede285d33811e5552d3ceb # v2
        continue-on-error: false
        with:
          directory: ./data
          line_ending_type: 'CRLF'
          include_pattern: '*.csv'
          pattern_type: 'shell_glob'
      - name: setup git
        run: |
          git config user.name "iptv-bot[bot]"
          git config user.email "84861620+iptv-bot[bot]@users.noreply.github.com"
      - run: git status
      - name: commit changes
        if: steps.db-update.outputs.processed_issues != 0
        run: |
          git add data/*.csv
          git status
          git commit -m "[Bot] Update data" -m "Committed by [iptv-bot](https://github.com/apps/iptv-bot) via [update](https://github.com/iptv-org/database/actions/runs/${{ github.run_id }}) workflow." -m "${{ steps.db-update.outputs.processed_issues }}" --no-verify
      - name: push all changes to the repository
        if: ${{ !env.ACT && github.ref == 'refs/heads/master' }}
        run: git push
